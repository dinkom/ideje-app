<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ideje">
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="manifest.json?v=1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ideje</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #f6f4ef; color: #1f2328;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* Gornja traka */
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 18px; height: 58px; }
  .tt { flex: 1; font-weight: 800; font-size: 22px; letter-spacing: -.5px; }
  .cnt { color: #7a7f87; font-variant-numeric: tabular-nums; font-size: 15px; }
  .filt { height: 40px; padding: 0 14px; border-radius: 99px; background: #fff; border: 1px solid #e3e0d8;
    font-size: 15px; font-weight: 600; color: #7a7f87; }
  .filt.on { background: #ffcf3f; border-color: #ffcf3f; color: #1f2328; }

  /* Kartica */
  .stage { flex: 1; padding: 4px 16px 6px; perspective: 1400px; min-height: 0; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform .45s ease; touch-action: none; }
  .card.flip { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 26px; padding: 24px 24px 20px; display: flex; flex-direction: column;
    backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden;
    background: #fff; border-top: 8px solid var(--c); box-shadow: 0 6px 24px rgba(60, 50, 30, .10); }
  .back { transform: rotateY(180deg); background: color-mix(in srgb, var(--c) 9%, #fff); }
  .tag { align-self: flex-start; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 99px;
    color: var(--c); background: color-mix(in srgb, var(--c) 12%, #fff); }
  .emoji { font-size: clamp(54px, 15vw, 80px); margin: 20px 0 12px; line-height: 1; }
  .face h2 { font-size: clamp(24px, 7vw, 31px); line-height: 1.15; margin-bottom: 14px; font-weight: 800; letter-spacing: -.3px; }
  .face p { font-size: clamp(16px, 4.4vw, 19px); line-height: 1.55; color: #3a3f46; }
  .face p.probaj { font-size: clamp(19px, 5.4vw, 23px); font-weight: 600; color: #1f2328; }
  .src { margin-top: auto; padding-top: 14px; font-size: 14px; color: #7a7f87; font-style: italic; }
  .hint { font-size: 12px; color: #a3a8b0; margin-top: 6px; }

  .in-next .face { animation: inNext .28s ease; }
  .in-prev .face { animation: inPrev .28s ease; }
  @keyframes inNext { from { opacity: 0; translate: 40px 0; } }
  @keyframes inPrev { from { opacity: 0; translate: -40px 0; } }

  /* Donja traka */
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 24px 16px; }
  .bar button { width: 76px; height: 60px; border-radius: 18px; background: #fff; border: 1px solid #e3e0d8;
    font-size: 30px; color: #1f2328; transition: transform .1s; }
  .bar button:active { transform: scale(.92); }
  .bar button:disabled { opacity: .3; }
  .bar .fav { font-size: 28px; color: #b9bdc4; }
  .bar .fav.on { color: #f0a800; background: #fff6d6; border-color: #ffe08a; }

  .empty { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; gap: 12px; padding: 30px; color: #7a7f87; font-size: 17px; line-height: 1.5; }
  .empty div { font-size: 54px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const KLJUC = 'ideje_v1';
let D = { teme: {}, kartice: [] };
let store = { fav: [], pos: 0, favPos: 0 };
try { Object.assign(store, JSON.parse(localStorage.getItem(KLJUC)) || {}); } catch (e) {}
function save() { try { localStorage.setItem(KLJUC, JSON.stringify(store)); } catch (e) {} }

const st = { samoFav: false, flip: false, dir: '' };
const app = document.getElementById('app');

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isFav = id => store.fav.includes(id);
const tema = ime => D.teme[ime] || { boja: '#5b6470', ikona: '💡' };
// Favoriti idu redom kojim su u cards.json
const spil = () => st.samoFav ? D.kartice.filter(c => isFav(c.id)) : D.kartice;
const posKey = () => st.samoFav ? 'favPos' : 'pos';

function render() {
  const s = spil();
  let pos = Math.min(store[posKey()] || 0, Math.max(s.length - 1, 0));
  store[posKey()] = pos;

  const top = `<header class="top">
    <div class="tt">Ideje</div>
    <div class="cnt">${s.length ? (pos + 1) + ' / ' + s.length : ''}</div>
    <button class="filt ${st.samoFav ? 'on' : ''}" data-a="filt">★ ${store.fav.length}</button></header>`;

  if (!s.length) {
    app.innerHTML = top + `<div class="empty"><div>☆</div>Još nemaš favorita.<br>Označi ★ na kartici koja ti se sviđa.</div>`;
    return;
  }

  const c = s[pos], t = tema(c.tema), fav = isFav(c.id);
  const izvor = esc(c.izvor) + (c.autor ? ' — ' + esc(c.autor) : '');
  app.innerHTML = top + `<main class="stage ${st.dir ? 'in-' + st.dir : ''}">
    <div class="card ${st.flip ? 'flip' : ''}" id="card" style="--c:${t.boja}">
      <div class="face front">
        <div class="tag">${t.ikona} ${esc(c.tema)}</div>
        <div class="emoji">${c.emoji || '💡'}</div>
        <h2>${esc(c.naslov)}</h2>
        <p>${esc(c.tekst)}</p>
        <div class="src">${izvor}</div>
        <div class="hint">dodirni za primjenu ↻</div>
      </div>
      <div class="face back">
        <div class="tag">🎯 Probaj</div>
        <div class="emoji">${c.emoji || '💡'}</div>
        <p class="probaj">${esc(c.probaj)}</p>
        <div class="src">${esc(c.naslov)}</div>
        <div class="hint">dodirni za povratak ↻</div>
      </div>
    </div></main>
    <footer class="bar">
      <button data-a="prev" ${pos === 0 ? 'disabled' : ''}>‹</button>
      <button class="fav ${fav ? 'on' : ''}" data-a="fav">${fav ? '★' : '☆'}</button>
      <button data-a="next" ${pos === s.length - 1 ? 'disabled' : ''}>›</button>
    </footer>`;
  bindCard(document.getElementById('card'));
  save();
}

function go(delta) {
  const s = spil(), p = (store[posKey()] || 0) + delta;
  if (p < 0 || p >= s.length) return;
  store[posKey()] = p;
  st.flip = false; st.dir = delta > 0 ? 'next' : 'prev';
  render();
}

function flip() {
  const card = document.getElementById('card');
  if (!card) return;
  st.flip = !st.flip;
  card.classList.toggle('flip', st.flip);
}

function act(a) {
  if (a === 'prev') go(-1);
  else if (a === 'next') go(1);
  else if (a === 'filt') { st.samoFav = !st.samoFav; st.flip = false; st.dir = ''; render(); }
  else if (a === 'fav') {
    const s = spil(), id = s[store[posKey()]].id;
    store.fav = isFav(id) ? store.fav.filter(x => x !== id) : [...store.fav, id];
    st.dir = ''; render();
  }
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && !b.disabled) act(b.dataset.a);
});

// Dodir na karticu = okreni; povlačenje lijevo/desno = sljedeća/prethodna
function bindCard(card) {
  let x0 = null, y0 = null;
  card.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; });
  card.addEventListener('pointerup', e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) flip();
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === ' ') { e.preventDefault(); flip(); }
});

fetch('cards.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(d => { D = d; render(); })
  .catch(() => {
    app.innerHTML = `<div class="empty"><div>⚠️</div>Ne mogu učitati cards.json.<br>Provjeri je li datoteka uz index.html i je li JSON ispravan.</div>`;
  });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
