<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ideje">
<meta name="theme-color" content="#14161a">
<title>Ideje</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #14161a; color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* Početna */
  .home { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 24px; }
  .home h1 { font-size: 40px; font-weight: 800; letter-spacing: -1px; }
  .stat { color: #9aa0a6; margin-bottom: 18px; }
  .big { display: flex; align-items: center; gap: 16px; width: 100%; padding: 20px 22px; border-radius: 18px;
    background: #22252b; font-size: 20px; font-weight: 600; text-align: left; transition: transform .1s; }
  .big:active { transform: scale(.97); }
  .big span { font-size: 28px; width: 36px; text-align: center; }

  /* Gornja traka */
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; height: 56px; }
  .ikon { width: 44px; height: 44px; border-radius: 12px; background: #22252b; font-size: 20px; }
  .tt { flex: 1; font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cnt { color: #9aa0a6; font-variant-numeric: tabular-nums; }

  /* Teme */
  .grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 16px 20px; align-content: start; }
  .tema { border-radius: 18px; padding: 18px 14px; min-height: 104px; text-align: left; display: flex;
    flex-direction: column; justify-content: space-between; font-weight: 700; font-size: 16px; }
  .tema .i { font-size: 30px; }
  .tema small { font-weight: 500; opacity: .8; }

  /* Kartica */
  .stage { flex: 1; padding: 6px 16px; perspective: 1400px; min-height: 0; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform .45s ease; touch-action: none; }
  .card.flip { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 26px; padding: 26px 24px; display: flex; flex-direction: column;
    backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden;
    background: linear-gradient(160deg, var(--c), color-mix(in srgb, var(--c) 55%, #000)); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .back { transform: rotateY(180deg); }
  .tag { align-self: flex-start; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 99px; background: rgba(0,0,0,.22); }
  .emoji { font-size: clamp(56px, 16vw, 84px); margin: 22px 0 14px; line-height: 1; }
  .face h2 { font-size: clamp(24px, 7vw, 32px); line-height: 1.15; margin-bottom: 14px; font-weight: 800; }
  .face p { font-size: clamp(16px, 4.4vw, 19px); line-height: 1.5; opacity: .95; }
  .face p.probaj { font-size: clamp(19px, 5.4vw, 23px); font-weight: 600; }
  .src { margin-top: auto; padding-top: 14px; font-size: 14px; opacity: .8; font-style: italic; }
  .hint { font-size: 12px; opacity: .55; margin-top: 8px; }

  .in-next .face { animation: inNext .28s ease; }
  .in-prev .face { animation: inPrev .28s ease; }
  @keyframes inNext { from { opacity: 0; translate: 40px 0; } }
  @keyframes inPrev { from { opacity: 0; translate: -40px 0; } }

  /* Donja traka */
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px 16px; }
  .bar button { width: 72px; height: 60px; border-radius: 18px; background: #22252b; font-size: 30px; transition: transform .1s; }
  .bar button:active { transform: scale(.92); }
  .bar button:disabled { opacity: .25; }
  .bar .fav { font-size: 28px; }
  .bar .fav.on { color: #ffcc33; }

  .empty { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; gap: 12px; padding: 30px; color: #9aa0a6; font-size: 17px; line-height: 1.5; }
  .empty div { font-size: 54px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const KLJUC = 'ideje_v1';
let D = { teme: {}, kartice: [] };
let store = { fav: [], seen: [] };
try { Object.assign(store, JSON.parse(localStorage.getItem(KLJUC)) || {}); } catch (e) {}
function save() { try { localStorage.setItem(KLJUC, JSON.stringify(store)); } catch (e) {} }

const st = { view: 'home', deck: [], pos: 0, flip: false, naslov: '', single: false, dir: '' };
const app = document.getElementById('app');

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isFav = id => store.fav.includes(id);
const tema = ime => D.teme[ime] || { boja: '#444a52', ikona: '💡' };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function idejaDana() {
  const d = new Date();
  const k = d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate();
  return D.kartice[(k * 2654435761) % D.kartice.length];
}

function openDeck(kartice, naslov, single) {
  Object.assign(st, { view: 'deck', deck: kartice, pos: 0, flip: false, naslov, single: !!single, dir: '' });
  render();
}

function renderHome() {
  const ids = new Set(D.kartice.map(c => c.id));
  const vid = store.seen.filter(id => ids.has(id)).length;
  const fav = store.fav.filter(id => ids.has(id)).length;
  return `<div class="home">
    <h1>Ideje</h1>
    <p class="stat">Viđeno ${vid}/${D.kartice.length} · ★ ${fav}</p>
    <button class="big" data-a="rnd"><span>🎲</span>Nasumično</button>
    <button class="big" data-a="teme"><span>🗂️</span>Po temi</button>
    <button class="big" data-a="favs"><span>★</span>Favoriti</button>
    <button class="big" data-a="dan"><span>☀️</span>Ideja dana</button>
  </div>`;
}

function renderTeme() {
  const btns = Object.keys(D.teme).map(ime => {
    const t = tema(ime), n = D.kartice.filter(c => c.tema === ime).length;
    return `<button class="tema" style="background:${t.boja}" data-a="tema" data-v="${esc(ime)}">
      <span class="i">${t.ikona}</span><span>${esc(ime)}<br><small>${n} kartica</small></span></button>`;
  }).join('');
  return `<header class="top"><button class="ikon" data-a="home">⌂</button><div class="tt">Teme</div></header>
    <div class="grid">${btns}</div>`;
}

function renderDeck() {
  const top = `<header class="top"><button class="ikon" data-a="home">⌂</button>
    <div class="tt">${esc(st.naslov)}</div>
    <div class="cnt">${st.single || !st.deck.length ? '' : (st.pos + 1) + ' / ' + st.deck.length}</div></header>`;
  if (!st.deck.length) {
    return top + `<div class="empty"><div>☆</div>Još nemaš favorita.<br>Označi ★ na kartici koja ti se sviđa.</div>`;
  }
  const c = st.deck[st.pos], t = tema(c.tema), fav = isFav(c.id);
  if (!store.seen.includes(c.id)) { store.seen.push(c.id); save(); }
  const izvor = esc(c.izvor) + (c.autor ? ' — ' + esc(c.autor) : '');
  return top + `<main class="stage ${st.dir ? 'in-' + st.dir : ''}">
    <div class="card ${st.flip ? 'flip' : ''}" id="card" style="--c:${t.boja}">
      <div class="face front">
        <div class="tag">${t.ikona} ${esc(c.tema)}</div>
        <div class="emoji">${c.emoji || '💡'}</div>
        <h2>${esc(c.naslov)}</h2>
        <p>${esc(c.tekst)}</p>
        <div class="src">${izvor}</div>
        <div class="hint">dodirni za primjenu ↻</div>
      </div>
      <div class="face back">
        <div class="tag">🎯 Probaj</div>
        <div class="emoji">${c.emoji || '💡'}</div>
        <p class="probaj">${esc(c.probaj)}</p>
        <div class="src">${esc(c.naslov)}</div>
        <div class="hint">dodirni za povratak ↻</div>
      </div>
    </div></main>
    <footer class="bar">
      <button data-a="prev" ${st.single || st.pos === 0 ? 'disabled' : ''}>‹</button>
      <button class="fav ${fav ? 'on' : ''}" data-a="fav">${fav ? '★' : '☆'}</button>
      <button data-a="next" ${st.single || st.pos === st.deck.length - 1 ? 'disabled' : ''}>›</button>
    </footer>`;
}

function render() {
  app.innerHTML = st.view === 'home' ? renderHome() : st.view === 'teme' ? renderTeme() : renderDeck();
  const card = document.getElementById('card');
  if (card) bindCard(card);
}

function go(delta) {
  const p = st.pos + delta;
  if (st.single || p < 0 || p >= st.deck.length) return;
  Object.assign(st, { pos: p, flip: false, dir: delta > 0 ? 'next' : 'prev' });
  render();
}

function act(a, v) {
  if (a === 'home') { st.view = 'home'; render(); }
  else if (a === 'teme') { st.view = 'teme'; render(); }
  else if (a === 'rnd') openDeck(shuffle([...D.kartice]), 'Nasumično');
  else if (a === 'tema') openDeck(D.kartice.filter(c => c.tema === v), v);
  else if (a === 'favs') openDeck(D.kartice.filter(c => isFav(c.id)), 'Favoriti');
  else if (a === 'dan') openDeck([idejaDana()], 'Ideja dana', true);
  else if (a === 'prev') go(-1);
  else if (a === 'next') go(1);
  else if (a === 'fav') {
    const id = st.deck[st.pos].id;
    store.fav = isFav(id) ? store.fav.filter(x => x !== id) : [...store.fav, id];
    save(); st.dir = ''; render();
  }
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && !b.disabled) act(b.dataset.a, b.dataset.v);
});

// Dodir na karticu = okreni; povlačenje lijevo/desno = sljedeća/prethodna
function bindCard(card) {
  let x0 = null, y0 = null;
  card.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; });
  card.addEventListener('pointerup', e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) { st.flip = !st.flip; card.classList.toggle('flip', st.flip); }
  });
}

document.addEventListener('keydown', e => {
  if (st.view !== 'deck') return;
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === ' ') { e.preventDefault(); const c = document.getElementById('card'); if (c) { st.flip = !st.flip; c.classList.toggle('flip', st.flip); } }
});

fetch('cards.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(d => { D = d; render(); })
  .catch(() => {
    app.innerHTML = `<div class="empty"><div>⚠️</div>Ne mogu učitati cards.json.<br>Provjeri je li datoteka uz index.html i je li JSON ispravan.</div>`;
  });
</script>
</body>
</html>
